services:
  postgres:
    image: postgres:17
    container_name: restaurant-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant123

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_db"]
      interval: 10s
      timeout: 5s
      retries: 5